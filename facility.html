<!DOCTYPE html>
<html lang="ja" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">施設紹介 | JIUJITSU GUILD 豊橋のブラジリアン柔術専門道場</title>
<meta name="description" id="pageDesc" content="愛知県豊橋市吉川町のブラジリアン柔術専門道場「柔術ギルド」の施設紹介。マットエリア、エントランス、ギルドランキングモニターをご紹介します。">
<link rel="icon" type="image/jpeg" href="images/favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --black:   #0A0A0A;
  --white:   #FFFFFF;
  --red:     #C41E1E;
  --red-dim: #8B1515;
  --muted:   #999999;
  --border:  #2a2a2a;
  --gray:    #141414;
  --gray-2:  #1e1e1e;
  --font-en: 'Bebas Neue', sans-serif;
  --font-jp: 'Noto Sans JP', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--black); color: var(--white); font-family: var(--font-jp); line-height: 1.8; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: rgba(10,10,10,0.92);
  backdrop-filter: blur(8px); z-index: 10; gap: 16px;
}
.logo { font-family: var(--font-en); font-size: 19px; letter-spacing: 2px; text-decoration: none; color: var(--white); flex-shrink: 0; }
.logo span { color: var(--red); }
.header-right { display: flex; align-items: center; gap: 16px; }
.back-link { font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.back-link:hover { color: var(--white); }
.lang-switch {
  display: flex; border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
  flex-shrink: 0;
}
.lang-btn {
  background: none; border: none; color: var(--muted); font-size: 12px; font-family: var(--font-en);
  letter-spacing: 1px; padding: 6px 14px; cursor: pointer; transition: all 0.15s;
}
.lang-btn.active { background: var(--red); color: var(--white); }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

.hero { padding: 72px 0 48px; text-align: center; }
.eyebrow { font-family: var(--font-en); font-size: 14px; letter-spacing: 5px; color: var(--red); margin-bottom: 14px; }
.hero h1 { font-size: 30px; font-weight: 900; letter-spacing: 1px; }
.hero .sub { margin-top: 14px; color: var(--muted); font-size: 14px; }

/* ===== 施設ツアー（写真を切り抜かず、1枚ずつ大きく見せる） ===== */
.tour { display: flex; flex-direction: column; gap: 64px; }
.tour-item { margin: 0; }
.tour-photo {
  display: block; width: 100%; padding: 0; border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden; background: var(--gray); cursor: zoom-in;
  transition: border-color 0.2s ease;
}
.tour-photo:hover { border-color: var(--red-dim); }
.tour-photo img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: contain; }
.tour-caption { display: flex; gap: 20px; align-items: flex-start; margin-top: 20px; }
.tour-num {
  font-family: var(--font-en); font-size: 34px; line-height: 1; color: var(--red);
  letter-spacing: 1px; flex-shrink: 0; min-width: 44px;
}
.tour-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.tour-desc { font-size: 14px; color: #bbb; line-height: 1.9; }
.tour-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.tour-empty {
  border: 1px dashed var(--border); border-radius: 6px; padding: 56px 24px;
  text-align: center; color: var(--muted); font-size: 14px;
}

/* 施設情報 */
.info {
  margin: 80px 0 24px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--gray); padding: 28px 28px 20px;
}
.info-title { font-family: var(--font-en); font-size: 18px; letter-spacing: 3px; color: var(--red); margin-bottom: 14px; }
.info-row { display: flex; gap: 18px; padding: 12px 0; border-top: 1px solid var(--border); font-size: 14px; }
.info-row:first-of-type { border-top: none; }
.info-label { width: 100px; flex-shrink: 0; color: var(--muted); }
.info-link { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--red); text-decoration: none; }

/* CTA */
.cta-box {
  margin: 40px 0 80px; padding: 44px 24px; text-align: center;
  border: 1px solid var(--border); border-radius: 8px;
  background: radial-gradient(ellipse at center, rgba(196,30,30,0.08), transparent 70%);
}
.btn-primary {
  display: inline-block; font-weight: 700; font-size: 16px; letter-spacing: 1px;
  background: var(--red); color: var(--white); padding: 18px 44px; border-radius: 4px; text-decoration: none;
}
.btn-primary:hover { background: #e02020; }

.footer { text-align: center; padding: 32px 24px; border-top: 1px solid var(--border); font-size: 12px; }
.footer a { color: var(--muted); text-decoration: none; margin: 0 10px; }
.footer a:hover { color: var(--white); }

/* ライトボックス（写真を画面いっぱいに拡大） */
.lightbox {
  display: none; position: fixed; inset: 0; z-index: 100; background: rgba(5,5,5,0.96);
  align-items: center; justify-content: center; flex-direction: column; padding: 24px;
}
.lightbox.show { display: flex; }
.lightbox img { max-width: 96vw; max-height: 80vh; object-fit: contain; border-radius: 4px; }
.lightbox-caption { margin-top: 16px; font-size: 14px; color: var(--white); text-align: center; }
.lb-btn {
  position: absolute; background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--white);
  width: 46px; height: 46px; border-radius: 50%; font-size: 22px; cursor: pointer;
}
.lb-close { top: 20px; right: 20px; }
.lb-prev { left: 12px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 12px; top: 50%; transform: translateY(-50%); }

@media (max-width: 700px) {
  .hero { padding: 48px 0 32px; }
  .hero h1 { font-size: 24px; }
  .wrap { padding: 0 16px; }
  .tour { gap: 44px; }
  .tour-caption { gap: 14px; margin-top: 14px; }
  .tour-num { font-size: 26px; min-width: 34px; }
  .tour-title { font-size: 16px; }
  .tour-desc { font-size: 13px; }
  .info { padding: 22px 18px 14px; }
  .info-row { flex-direction: column; gap: 2px; }
  .lightbox { padding: 12px; }
}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">JIUJITSU <span>GUILD</span></a>
  <div class="header-right">
    <div class="lang-switch">
      <button class="lang-btn" id="langBtnJa" onclick="setLang('ja')">JP</button>
      <button class="lang-btn" id="langBtnPt" onclick="setLang('pt')">PT</button>
    </div>
    <a href="index.html" class="back-link" id="backLink">← ホームに戻る</a>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">FACILITY</div>
    <h1 id="heroTitle">施設紹介</h1>
    <div class="sub" id="heroSub">豊橋市吉川町のブラジリアン柔術専門道場</div>
  </div>

  <!-- 写真はJS（下の facilityPhotos）から自動で並びます -->
  <div class="tour" id="tour"></div>

  <div class="info">
    <div class="info-title">INFORMATION</div>
    <div class="info-row"><span class="info-label" id="infoLabelAddr">所在地</span><span>愛知県豊橋市吉川町13番2</span></div>
    <div class="info-row"><span class="info-label" id="infoLabelParking">駐車場</span><span id="infoParkingText">敷地内 8台／徒歩1分以内に第二駐車場あり</span></div>
    <a href="index.html#access" class="info-link" id="infoLink">開館時間・アクセスの詳細はこちら →</a>
  </div>

  <div class="cta-box">
    <a href="index.html#contact" class="btn-primary" id="ctaBtn">⚔ 体験を予約する</a>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLb()">
  <button class="lb-btn lb-close" onclick="closeLb()" id="lbCloseBtn" aria-label="閉じる">×</button>
  <button class="lb-btn lb-prev" onclick="navLb(-1)" id="lbPrevBtn" aria-label="前の写真">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" onclick="navLb(1)" id="lbNextBtn" aria-label="次の写真">›</button>
  <div class="lightbox-caption" id="lbCaption"></div>
</div>

<footer class="footer">
  <a href="index.html" id="footHome">ホーム</a>
  <a href="instructors.html" id="footInstructors">インストラクター</a>
  <a href="index.html#access" id="footAccess">アクセス</a>
  <a href="https://www.instagram.com/jiujitsu_guild" target="_blank" rel="noopener">Instagram</a>
</footer>

<script>
// =====================================================================
// 施設写真（JP・PT共通データ）
// 写真を追加する時は、この配列に1ブロック足すだけでOK（images/facility/ に写真を置く）
// title/desc は { ja, pt } で両言語を書く（片方が未記入でももう片方は表示されます）
// note：補足（省略可、同じく { ja, pt }）
// =====================================================================
const facilityPhotos = [
  {
    src: 'images/facility/mat-01.jpg',
    title: { ja: 'マットエリア', pt: 'Área do tatame' },
    desc: {
      ja: '白で統一した、広く明るいマットスペース。柔術・柔道・オープンマットまで、すべての練習をこのマットで行います。',
      pt: 'Um tatame amplo e claro, todo em branco. Jiu-jitsu, judô e open mat — todo o treino acontece aqui.',
    },
  },
  {
    src: 'images/facility/mat-02.jpg',
    title: { ja: 'マットエリア（入口側）', pt: 'Área do tatame (lado da entrada)' },
    desc: {
      ja: 'エアコンとシーリングファンを備え、季節を問わず快適に練習できる環境を整えています。',
      pt: 'Com ar-condicionado e ventilador de teto, pra treinar bem em qualquer época do ano.',
    },
  },
  {
    src: 'images/facility/entrance.jpg',
    title: { ja: 'エントランス', pt: 'Entrada' },
    desc: {
      ja: 'グリーンに囲まれた、落ち着いた雰囲気のエントランス。靴箱やベンチもあり、練習前後にひと息つけます。',
      pt: 'Uma entrada tranquila, cercada de verde. Tem sapateira e banco pra você relaxar antes ou depois do treino.',
    },
  },
  {
    src: 'images/facility/reception.jpg',
    title: { ja: '受付エリア', pt: 'Recepção' },
    desc: {
      ja: 'ギルドランキングモニターとチェックイン端末を設置した受付エリア。練習前に、ここでチェックインします。',
      pt: 'Aqui ficam o monitor de ranking do Guild e o totem de check-in. É por onde você passa antes de treinar.',
    },
  },
  {
    src: 'images/facility/monitor-demo.png',
    title: { ja: 'ギルドランキングモニター', pt: 'Monitor de ranking do Guild' },
    desc: {
      ja: 'NFCカードでチェックインするだけで、月間・累計の練習回数を自動で集計。日々の積み重ねが、そのままランキングに表示されます。',
      pt: 'Basta fazer check-in com o cartão NFC: o sistema conta sozinho quantas vezes você treinou no mês e no total. Sua constância aparece direto no ranking.',
    },
    note: {
      ja: '※写真はデモ画面です。実際の会員名は表示していません。',
      pt: '※ Esta imagem é uma tela de demonstração. Nenhum nome real de aluno é exibido aqui.',
    },
  },
  {
    src: 'images/facility/changing-room.jpg',
    title: { ja: '更衣室', pt: 'Vestiário' },
    desc: {
      ja: '更衣室は男女別です（写真左：女性更衣室、右：男性更衣室）。女性更衣室には女性専用トイレを併設しているので、女性の方も安心して通えます。手洗い場もあります。',
      pt: 'Vestiários separados por gênero (na foto: à esquerda o feminino, à direita o masculino). O vestiário feminino tem banheiro exclusivo, pra mais tranquilidade. Também tem pia pra lavar as mãos.',
    },
  },
  {
    src: 'images/facility/toilet.jpg',
    title: { ja: 'トイレ（マットエリア）', pt: 'Banheiro (área do tatame)' },
    desc: {
      ja: 'マットエリアにあるトイレは、男女共用です。練習の合間にもすぐに利用できます。',
      pt: 'O banheiro da área do tatame é compartilhado (unissex). Fica bem à mão durante o treino.',
    },
  },
];

// =====================================================================
// UI文言（両言語）
// =====================================================================
const UI = {
  ja: {
    htmlLang: 'ja',
    pageTitle: '施設紹介 | JIUJITSU GUILD 豊橋のブラジリアン柔術専門道場',
    pageDesc: '愛知県豊橋市吉川町のブラジリアン柔術専門道場「柔術ギルド」の施設紹介。マットエリア、エントランス、ギルドランキングモニターをご紹介します。',
    backLink: '← ホームに戻る',
    heroTitle: '施設紹介',
    heroSub: '豊橋市吉川町のブラジリアン柔術専門道場',
    tourEmpty: '施設の写真は、現在準備中です。',
    infoLabelAddr: '所在地',
    infoLabelParking: '駐車場',
    infoParkingText: '敷地内 8台／徒歩1分以内に第二駐車場あり',
    infoLink: '開館時間・アクセスの詳細はこちら →',
    ctaBtn: '⚔ 体験を予約する',
    lbClose: '閉じる', lbPrev: '前の写真', lbNext: '次の写真',
    footHome: 'ホーム', footInstructors: 'インストラクター', footAccess: 'アクセス',
    zoomAria: (t) => `${t}を拡大`,
    altPrefix: '柔術ギルド ',
  },
  pt: {
    htmlLang: 'pt',
    pageTitle: 'Instalações | JIUJITSU GUILD Academia de Jiu-Jitsu Brasileiro em Toyohashi',
    pageDesc: 'Conheça as instalações do Jiujitsu Guild, academia de Jiu-Jitsu Brasileiro em Toyohashi, Aichi. Área do tatame, entrada e monitor de ranking do Guild.',
    backLink: '← Voltar ao início',
    heroTitle: 'Instalações',
    heroSub: 'Academia de Jiu-Jitsu em Toyohashi-shi, Yoshikawa-cho',
    tourEmpty: 'Fotos em breve.',
    infoLabelAddr: 'Endereço',
    infoLabelParking: 'Estacionamento',
    infoParkingText: '8 vagas no local／2º estacionamento a 1 min a pé',
    infoLink: 'Horários e detalhes de acesso →',
    ctaBtn: '⚔ Agendar aula experimental',
    lbClose: 'Fechar', lbPrev: 'Foto anterior', lbNext: 'Próxima foto',
    footHome: 'Início', footInstructors: 'Instrutores', footAccess: 'Acesso',
    zoomAria: (t) => `Ampliar: ${t}`,
    altPrefix: 'Jiujitsu Guild ',
  },
};

let currentLang = 'ja';

function getInitialLang() {
  const params = new URLSearchParams(location.search);
  const q = params.get('lang');
  if (q === 'pt' || q === 'ja') return q;
  return 'ja';
}

function pick(field) {
  // { ja, pt } オブジェクトから現在の言語を取り出す（片方が空でももう片方を表示）
  if (!field) return '';
  return field[currentLang] || field.ja || field.pt || '';
}

function renderTour() {
  const tour = document.getElementById('tour');
  const t = UI[currentLang];
  if (facilityPhotos.length === 0) {
    tour.innerHTML = `<div class="tour-empty">${t.tourEmpty}</div>`;
    return;
  }
  tour.innerHTML = '';
  facilityPhotos.forEach((p, i) => {
    const title = pick(p.title);
    const desc = pick(p.desc);
    const note = pick(p.note);
    const fig = document.createElement('figure');
    fig.className = 'tour-item';
    const num = String(i + 1).padStart(2, '0');
    fig.innerHTML = `
      <button class="tour-photo" type="button" aria-label="${t.zoomAria(title)}">
        <img src="${p.src}" alt="${t.altPrefix}${title}" ${i === 0 ? '' : 'loading="lazy"'}>
      </button>
      <figcaption class="tour-caption">
        <div class="tour-num">${num}</div>
        <div>
          <div class="tour-title">${title}</div>
          <div class="tour-desc">${desc}</div>
          ${note ? `<div class="tour-note">${note}</div>` : ''}
        </div>
      </figcaption>`;
    fig.querySelector('.tour-photo').onclick = () => openLb(i);
    tour.appendChild(fig);
  });
}

function applyUI() {
  const t = UI[currentLang];
  document.getElementById('htmlRoot').lang = t.htmlLang;
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('pageDesc').setAttribute('content', t.pageDesc);
  document.getElementById('backLink').textContent = t.backLink;
  document.getElementById('heroTitle').textContent = t.heroTitle;
  document.getElementById('heroSub').textContent = t.heroSub;
  document.getElementById('infoLabelAddr').textContent = t.infoLabelAddr;
  document.getElementById('infoLabelParking').textContent = t.infoLabelParking;
  document.getElementById('infoParkingText').textContent = t.infoParkingText;
  document.getElementById('infoLink').textContent = t.infoLink;
  document.getElementById('ctaBtn').textContent = t.ctaBtn;
  document.getElementById('lbCloseBtn').setAttribute('aria-label', t.lbClose);
  document.getElementById('lbPrevBtn').setAttribute('aria-label', t.lbPrev);
  document.getElementById('lbNextBtn').setAttribute('aria-label', t.lbNext);
  document.getElementById('footHome').textContent = t.footHome;
  document.getElementById('footInstructors').textContent = t.footInstructors;
  document.getElementById('footAccess').textContent = t.footAccess;
  document.getElementById('langBtnJa').classList.toggle('active', currentLang === 'ja');
  document.getElementById('langBtnPt').classList.toggle('active', currentLang === 'pt');
}

function setLang(lang) {
  currentLang = lang;
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  applyUI();
  renderTour();
  if (document.getElementById('lightbox').classList.contains('show')) renderLb();
}

let lbIndex = 0;
function openLb(i) { lbIndex = i; renderLb(); document.getElementById('lightbox').classList.add('show'); }
function closeLb() { document.getElementById('lightbox').classList.remove('show'); }
function navLb(d) { lbIndex = (lbIndex + d + facilityPhotos.length) % facilityPhotos.length; renderLb(); }
function renderLb() {
  const p = facilityPhotos[lbIndex];
  const title = pick(p.title);
  const img = document.getElementById('lbImg');
  img.src = p.src; img.alt = UI[currentLang].altPrefix + title;
  document.getElementById('lbCaption').textContent = title;
}
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('show')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});

// 初期化
currentLang = getInitialLang();
applyUI();
renderTour();
</script>
</body>
</html>
