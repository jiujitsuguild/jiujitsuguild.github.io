<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!--
  =====================================================================
  柔術ギルド ランキング — 最終完全版 v4（個人NFC対応）

  【NFCチェックイン】
  カードURL例: https://あなたのURL/bjj-guild-monitor.html?id=001
  ?id= に会員IDを付けることで個人チェックインが可能

  【スプレッドシート列】
  id | name | monthly | total | belt | category | last_reset | last_checkin | is_instructor
  ※ is_instructor 列に「yes」を入れると、その会員は
  　月間ランキングから除外され、下部の「INSTRUCTORS」枠に表示されます
  　（累計・帯昇格トラッカーは通常通りカウントされます）
  =====================================================================
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJJ Guild Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:         #04060a;
  --surface:    #0e1420;
  --card:       #131b2a;
  --border:     #243050;
  --border-hi:  #3a4d70;
  --gold:       #d4a84c;
  --gold-light: #f0d070;
  --gold-dim:   #7a5f28;
  --white:      #f4f0e8;
  --white-dim:  #c8c2b4;
  --muted:      #6a7490;
  --kids-a:     #5aacf0;
  --kids-a-dim: #1a4880;
  --kids-b:     #50d0a0;
  --kids-b-dim: #0a5038;
  --g1:  rgba(212,168,76,0.45);
  --g2:  rgba(190,190,205,0.35);
  --g3:  rgba(180,110,60,0.35);
  --ka1: rgba(90,172,240,0.5);
  --kb1: rgba(80,208,160,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--white);
  font-family: 'Noto Sans JP', sans-serif;
  overflow: hidden;
  background-image:
    repeating-linear-gradient(0deg,  transparent, transparent 3px, rgba(255,255,255,0.013) 3px, rgba(255,255,255,0.013) 6px),
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(255,255,255,0.009) 3px, rgba(255,255,255,0.009) 6px);
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse 900px 600px at 50% -80px, rgba(212,168,76,0.05) 0%, transparent 70%);
  animation: breathe 18s ease-in-out infinite alternate;
  pointer-events: none; z-index: 0;
}
@keyframes breathe { from{opacity:0.6;transform:scale(1);} to{opacity:1;transform:scale(1.08);} }

/* PC画面 */
.scale-wrapper {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  overflow: hidden;
}
.pc-screen { width:1920px; height:1080px; display:grid; grid-template-rows:110px 1fr 52px; position:relative; z-index:1; transition:opacity 0.6s ease; flex-shrink:0; }
.pc-screen.fading { opacity:0; }
.pc-header { display:flex; align-items:center; justify-content:space-between; padding:0 56px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,rgba(212,168,76,0.04),transparent); position:relative; }
.pc-header::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold-light) 50%,var(--gold) 70%,transparent); transition:background 0.6s ease; }
.pc-header.kids-a-mode::before { background:linear-gradient(90deg,transparent,var(--kids-a-dim) 30%,var(--kids-a) 50%,var(--kids-a-dim) 70%,transparent); }
.pc-header.kids-b-mode::before { background:linear-gradient(90deg,transparent,var(--kids-b-dim) 30%,var(--kids-b) 50%,var(--kids-b-dim) 70%,transparent); }
.hdr-left { display:flex; flex-direction:column; gap:3px; }
.hdr-eyebrow { font-family:'Cinzel',serif; font-size:12px; letter-spacing:7px; color:var(--gold-dim); text-transform:uppercase; }
.hdr-title { font-family:'Cinzel',serif; font-size:38px; font-weight:900; letter-spacing:5px; background:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,var(--gold-dim)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; text-transform:uppercase; }
.hdr-center { display:flex; flex-direction:column; align-items:center; gap:6px; }
.season-chip { display:flex; align-items:center; gap:10px; border:1px solid var(--gold-dim); background:linear-gradient(135deg,rgba(212,168,76,0.12),rgba(212,168,76,0.04)); padding:7px 22px; border-radius:2px; font-family:'Cinzel',serif; font-size:14px; letter-spacing:4px; color:var(--gold); text-transform:uppercase; }
.month-chip { display:flex; align-items:center; gap:8px; font-family:'Cinzel',serif; font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; }
.month-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); animation:dotPulse 2s ease-in-out infinite; }
@keyframes dotPulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
.hdr-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; min-width:260px; }
.clock { font-family:'Cinzel',serif; font-size:36px; font-weight:700; letter-spacing:4px; color:var(--white); font-variant-numeric:tabular-nums; }
.clock-date { font-size:13px; letter-spacing:3px; color:var(--muted); font-family:'Cinzel',serif; text-transform:uppercase; }
.pc-main { display:grid; grid-template-columns:580px 1fr; overflow:hidden; position:relative; }
.pc-main::before { content:''; position:absolute; left:580px; top:0; bottom:0; width:1px; background:linear-gradient(180deg,transparent,var(--border) 15%,var(--border) 85%,transparent); z-index:2; }
.pc-footer { display:flex; align-items:center; justify-content:space-between; padding:0 56px; border-top:1px solid var(--border); background:linear-gradient(0deg,rgba(212,168,76,0.025),transparent); position:relative; }
.pc-footer::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold-light) 50%,var(--gold) 70%,transparent); }
.footer-left  { display:flex; align-items:center; gap:20px; }
.footer-right { display:flex; align-items:center; gap:16px; }
.footer-logo  { font-family:'Cinzel',serif; font-size:12px; letter-spacing:5px; color:var(--gold-dim); text-transform:uppercase; }
.footer-sep   { width:1px; height:18px; background:var(--border); }
.last-upd     { font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; color:var(--muted); }
.next-fetch   { font-family:'Cinzel',serif; font-size:11px; letter-spacing:2px; color:var(--muted); }
.bar-wrap { width:180px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.bar-fill { height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold)); border-radius:2px; width:0%; transition:width 1s linear; }
.slide-indicator { display:flex; align-items:center; gap:8px; }
.s-pip { width:8px; height:8px; border-radius:50%; border:1px solid var(--border); transition:all 0.4s ease; }
.s-pip.adult-on  { background:var(--gold);   border-color:var(--gold); }
.s-pip.kids-a-on { background:var(--kids-a); border-color:var(--kids-a); }
.s-pip.kids-b-on { background:var(--kids-b); border-color:var(--kids-b); }
.s-pip.off       { background:transparent; }
.slide-bar-wrap { width:160px; height:2px; background:var(--border); border-radius:2px; overflow:hidden; }
.slide-bar { height:100%; border-radius:2px; width:0%; }
.slide-bar.adult  { background:linear-gradient(90deg,var(--gold-dim),var(--gold)); }
.slide-bar.kids-a { background:linear-gradient(90deg,var(--kids-a-dim),var(--kids-a)); }
.slide-bar.kids-b { background:linear-gradient(90deg,var(--kids-b-dim),var(--kids-b)); }

/* Podium */
.podium-col { display:flex; flex-direction:column; padding:28px 36px 24px 56px; gap:14px; }
.col-label { font-family:'Cinzel',serif; font-size:10px; letter-spacing:6px; color:var(--gold-dim); text-transform:uppercase; display:flex; align-items:center; gap:12px; }
.col-label.kids-a { color:var(--kids-a-dim); }
.col-label.kids-b { color:var(--kids-b-dim); }
.col-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,currentColor,transparent); opacity:0.5; }
.cat-label { font-family:'Cinzel',serif; font-size:10px; letter-spacing:4px; text-transform:uppercase; padding:3px 10px; border-radius:2px; border:1px solid; }
.cat-adult  { color:var(--gold);   border-color:var(--gold-dim);   background:rgba(212,168,76,0.1); }
.cat-kids-a { color:var(--kids-a); border-color:var(--kids-a-dim); background:rgba(90,172,240,0.1); }
.cat-kids-b { color:var(--kids-b); border-color:var(--kids-b-dim); background:rgba(80,208,160,0.1); }
.p-card { display:grid; grid-template-columns:60px 1fr auto; align-items:center; gap:18px; padding:20px 22px; border:1px solid var(--border); border-radius:4px; background:var(--card); position:relative; overflow:hidden; animation:slideInLeft 0.7s cubic-bezier(0.22,1,0.36,1) both; }
.p-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; }
.p-card::after  { content:''; position:absolute; inset:0; background:linear-gradient(90deg,rgba(255,255,255,0.012),transparent 40%); pointer-events:none; }
.p-card.a-r1  { border-color:var(--gold-dim); background:linear-gradient(135deg,#1a2235,var(--card) 60%); animation:slideInLeft 0.7s cubic-bezier(0.22,1,0.36,1) 0.05s both,rank1Pulse 6s ease-in-out 1s infinite; }
.p-card.a-r1::before { background:linear-gradient(180deg,var(--gold-light),var(--gold)); }
.p-card.a-r2  { border-color:rgba(180,180,195,0.3); box-shadow:0 0 24px var(--g2); animation-delay:0.15s; }
.p-card.a-r2::before { background:linear-gradient(180deg,#d8d8e8,#909098); }
.p-card.a-r3  { border-color:rgba(170,105,55,0.3); box-shadow:0 0 20px var(--g3); animation-delay:0.25s; }
.p-card.a-r3::before { background:linear-gradient(180deg,#d08860,#7a4828); }
.p-card.ka-r1 { border-color:var(--kids-a-dim); background:linear-gradient(135deg,#0e1e35,var(--card) 60%); animation:slideInLeft 0.7s cubic-bezier(0.22,1,0.36,1) 0.05s both,kaRank1Pulse 6s ease-in-out 1s infinite; }
.p-card.ka-r1::before { background:linear-gradient(180deg,#90d0f8,var(--kids-a)); }
.p-card.ka-r2 { border-color:rgba(40,130,200,0.3); box-shadow:0 0 24px rgba(40,130,200,0.3); animation-delay:0.15s; }
.p-card.ka-r2::before { background:linear-gradient(180deg,#4090d0,#205090); }
.p-card.ka-r3 { border-color:rgba(80,100,200,0.3); box-shadow:0 0 20px rgba(80,100,200,0.3); animation-delay:0.25s; }
.p-card.ka-r3::before { background:linear-gradient(180deg,#6080d8,#304090); }
.p-card.kb-r1 { border-color:var(--kids-b-dim); background:linear-gradient(135deg,#0a1e18,var(--card) 60%); animation:slideInLeft 0.7s cubic-bezier(0.22,1,0.36,1) 0.05s both,kbRank1Pulse 6s ease-in-out 1s infinite; }
.p-card.kb-r1::before { background:linear-gradient(180deg,#80e8c0,var(--kids-b)); }
.p-card.kb-r2 { border-color:rgba(40,160,120,0.3); box-shadow:0 0 24px rgba(40,160,120,0.3); animation-delay:0.15s; }
.p-card.kb-r2::before { background:linear-gradient(180deg,#40b890,#207860); }
.p-card.kb-r3 { border-color:rgba(60,140,100,0.3); box-shadow:0 0 20px rgba(60,140,100,0.3); animation-delay:0.25s; }
.p-card.kb-r3::before { background:linear-gradient(180deg,#50a878,#285840); }
@keyframes rank1Pulse  { 0%,100%{box-shadow:0 0 40px var(--g1),inset 0 1px 0 rgba(212,168,76,0.25);} 50%{box-shadow:0 0 70px rgba(212,168,76,0.6),inset 0 1px 0 rgba(212,168,76,0.4);} }
@keyframes kaRank1Pulse { 0%,100%{box-shadow:0 0 40px var(--ka1),inset 0 1px 0 rgba(90,172,240,0.25);} 50%{box-shadow:0 0 70px rgba(90,172,240,0.6),inset 0 1px 0 rgba(90,172,240,0.4);} }
@keyframes kbRank1Pulse { 0%,100%{box-shadow:0 0 40px var(--kb1),inset 0 1px 0 rgba(80,208,160,0.25);} 50%{box-shadow:0 0 70px rgba(80,208,160,0.6),inset 0 1px 0 rgba(80,208,160,0.4);} }
@keyframes slideInLeft { from{opacity:0;transform:translateX(-20px);} to{opacity:1;transform:translateX(0);} }
@keyframes fadeInRow   { from{opacity:0;transform:translateX(14px);} to{opacity:1;transform:translateX(0);} }
.p-avatar { width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-size:20px; font-weight:700; color:var(--bg); flex-shrink:0; }
.a-r1  .p-avatar { width:62px; height:62px; font-size:24px; background:linear-gradient(135deg,var(--gold-light),var(--gold)); box-shadow:0 0 18px rgba(212,168,76,0.6); }
.a-r2  .p-avatar { background:linear-gradient(135deg,#d8d8e4,#9898a8); }
.a-r3  .p-avatar { background:linear-gradient(135deg,#c87850,#7a4828); }
.ka-r1 .p-avatar { width:62px; height:62px; font-size:24px; background:linear-gradient(135deg,#90d0f8,var(--kids-a)); box-shadow:0 0 18px rgba(90,172,240,0.6); }
.ka-r2 .p-avatar { background:linear-gradient(135deg,#5090d0,#205090); }
.ka-r3 .p-avatar { background:linear-gradient(135deg,#6080d8,#304090); }
.kb-r1 .p-avatar { width:62px; height:62px; font-size:24px; background:linear-gradient(135deg,#80e8c0,var(--kids-b)); box-shadow:0 0 18px rgba(80,208,160,0.6); }
.kb-r2 .p-avatar { background:linear-gradient(135deg,#40b890,#207860); }
.kb-r3 .p-avatar { background:linear-gradient(135deg,#50a878,#285840); }
.p-info { min-width:0; }
.p-rank-label { font-family:'Cinzel',serif; font-size:10px; letter-spacing:4px; text-transform:uppercase; display:flex; align-items:center; gap:5px; margin-bottom:3px; }
.a-r1  .p-rank-label,.ka-r1 .p-rank-label,.kb-r1 .p-rank-label { color:var(--gold); }
.a-r2  .p-rank-label { color:#b0b0c0; }
.a-r3  .p-rank-label { color:#c08860; }
.ka-r2 .p-rank-label { color:var(--kids-a); }
.ka-r3 .p-rank-label { color:#6080d8; }
.kb-r2 .p-rank-label { color:var(--kids-b); }
.kb-r3 .p-rank-label { color:#50a878; }
.p-name { font-size:26px; font-weight:900; color:var(--white); line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:7px; }
.a-r1 .p-name,.ka-r1 .p-name,.kb-r1 .p-name { font-size:32px; }
.p-badges { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.p-count-wrap { text-align:right; flex-shrink:0; }
.p-monthly { font-family:'Cinzel',serif; font-weight:900; line-height:1; display:block; }
.a-r1  .p-monthly,.ka-r1 .p-monthly,.kb-r1 .p-monthly { font-size:48px; color:var(--gold); }
.a-r2  .p-monthly { font-size:36px; color:#d0d0dc; }
.a-r3  .p-monthly { font-size:36px; color:#d09070; }
.ka-r2 .p-monthly { font-size:36px; color:var(--kids-a); }
.ka-r3 .p-monthly { font-size:36px; color:#6080d8; }
.kb-r2 .p-monthly { font-size:36px; color:var(--kids-b); }
.kb-r3 .p-monthly { font-size:36px; color:#50a878; }
.p-unit  { font-size:10px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; display:block; margin-top:1px; }
.p-total { font-size:11px; color:var(--muted); display:block; margin-top:4px; }
.p-total span { color:var(--white-dim); font-weight:700; }
.crown { font-size:16px; animation:crownPulse 3s ease-in-out infinite; }
@keyframes crownPulse { 0%,100%{filter:drop-shadow(0 0 4px rgba(212,168,76,0.5));} 50%{filter:drop-shadow(0 0 12px rgba(212,168,76,1));} }

/* Ranking List */
.list-col { display:flex; flex-direction:column; padding:22px 56px 16px 36px; gap:0; overflow:hidden; }
.list-header { display:grid; grid-template-columns:60px 1fr 300px 100px 130px; gap:0; padding:8px 18px; margin-top:6px; border-bottom:1px solid var(--border-hi); }
.list-header span { font-family:'Cinzel',serif; font-size:12px; letter-spacing:4px; color:var(--muted); text-transform:uppercase; }
.lh-monthly,.lh-total { text-align:right; }
.r-row { display:grid; grid-template-columns:60px 1fr 300px 100px 130px; align-items:center; gap:0; height:52px; padding:0 18px; border-bottom:1px solid rgba(36,48,80,0.55); animation:fadeInRow 0.5s ease both; }
.r-row:nth-child(even) { background:rgba(255,255,255,0.012); }
.r-row:nth-child(1)  { animation-delay:0.03s; }
.r-row:nth-child(2)  { animation-delay:0.06s; }
.r-row:nth-child(3)  { animation-delay:0.09s; }
.r-row:nth-child(4)  { animation-delay:0.12s; }
.r-row:nth-child(5)  { animation-delay:0.15s; }
.r-row:nth-child(6)  { animation-delay:0.18s; }
.r-row:nth-child(7)  { animation-delay:0.21s; }
.r-row:nth-child(8)  { animation-delay:0.24s; }
.r-row:nth-child(9)  { animation-delay:0.27s; }
.r-row:nth-child(10) { animation-delay:0.30s; }
.r-row:nth-child(11) { animation-delay:0.33s; }
.r-row:nth-child(12) { animation-delay:0.36s; }
.r-row:nth-child(13) { animation-delay:0.39s; }
.r-row:nth-child(14) { animation-delay:0.42s; }
.r-row:nth-child(15) { animation-delay:0.45s; }
.r-row:nth-child(16) { animation-delay:0.48s; }
.r-row:nth-child(17) { animation-delay:0.51s; }
.r-row:nth-child(18) { animation-delay:0.54s; }

/* インストラクター枠（PC/TV画面 左下固定ウィジェット・コンパクト版） */
.instructor-widget {
  position: absolute; left: 20px; bottom: 72px; z-index: 500;
  background: rgba(10,14,26,0.94);
  border: 1px solid rgba(224,180,0,0.4);
  border-radius: 8px;
  padding: 10px 16px;
  width: 340px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
}
.instructor-widget-label {
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px;
  color: #e0b400; text-transform: uppercase; margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid rgba(224,180,0,0.2); padding-bottom: 6px;
}
.instr-card {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0;
}
.instr-card + .instr-card { border-top: 1px solid rgba(224,180,0,0.1); }
.instr-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #e0b400, #a87d00);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; color: #0a0e1a;
  flex-shrink: 0;
}
.instr-info { min-width: 0; flex: 1; }
.instr-name { font-size: 13px; font-weight: 700; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.instr-badges { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
.instr-badges .t-badge { font-size: 9px !important; padding: 2px 6px !important; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.instr-badges .b-badge { font-size: 9px !important; padding: 2px 6px !important; flex-shrink: 0; }
.instr-stats { text-align: right; flex-shrink: 0; }
.instr-total { font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700; color: #e0b400; line-height: 1; }
.instr-total-label { font-size: 6.5px; color: var(--muted); letter-spacing: 0.5px; margin-top: 2px; }

/* バージョン表示（フッター内） */
.version-tag {
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 1px;
  color: var(--gold-dim); background: rgba(224,180,0,0.08);
  border: 1px solid rgba(224,180,0,0.25); border-radius: 10px;
  padding: 2px 9px; margin-left: 10px;
}
.r-num  { font-family:'Cinzel',serif; font-size:22px; font-weight:700; color:var(--muted); }
.r-row.top6 .r-num { color:var(--white-dim); }
.r-name { font-size:21px; font-weight:700; color:var(--white); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:10px; }

/* 本日チェックイン済みインジケーター */
.checkin-dot {
  display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  background: #4ade80; margin-left: 7px; box-shadow: 0 0 6px rgba(74,222,128,0.8);
  vertical-align: middle; flex-shrink: 0;
}
.checkin-dot.m-dot { width: 7px; height: 7px; margin-left: 5px; }
.r-title-cell { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.r-monthly-cell { text-align:right; }
.r-monthly { font-family:'Cinzel',serif; font-size:24px; font-weight:700; color:var(--white); line-height:1; display:block; }
.r-m-unit  { font-size:9px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; }
.r-total-cell { text-align:right; padding-left:8px; }
.r-total { font-size:13px; color:var(--muted); }
.r-total span { color:var(--white-dim); font-weight:700; font-size:14px; }

/* 称号バッジ */
.t-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 12px 4px 9px; border-radius:2px; border:1px solid; font-family:'Noto Sans JP',sans-serif; font-size:13px; letter-spacing:0.5px; font-weight:700; white-space:nowrap; position:relative; overflow:hidden; }
.t-icon { font-size:13px; }
.t-low  { color:#8090b0; border-color:rgba(128,144,176,0.35); background:rgba(128,144,176,0.07); }
.t-mid  { color:#70a8e0; border-color:rgba(80,140,210,0.45);  background:rgba(80,140,210,0.08);  box-shadow:0 0 10px rgba(80,140,210,0.2); }
.t-high { color:var(--gold-light); border-color:rgba(212,168,76,0.75); background:rgba(212,168,76,0.11); animation:highPulse 2.5s ease-in-out infinite; }
.t-high::after { content:''; position:absolute; top:0; left:-100%; width:55%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent); animation:shimmer 2.4s ease-in-out infinite; }
@keyframes highPulse { 0%,100%{box-shadow:0 0 10px rgba(212,168,76,0.35);} 50%{box-shadow:0 0 28px rgba(212,168,76,0.8),0 0 50px rgba(212,168,76,0.25);} }
@keyframes shimmer { 0%{left:-60%;} 100%{left:140%;} }

/* 帯バッジ */
.b-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 12px 4px 9px; border-radius:2px; border:1px solid; font-size:13px; letter-spacing:1px; font-weight:700; text-transform:uppercase; }
.b-badge.b-pt { font-size:11px; letter-spacing:0.3px; padding:5px 8px; white-space:nowrap; gap:5px; }
.b-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.b-white  { color:#e8e4dc; border-color:rgba(232,228,220,0.3); background:rgba(232,228,220,0.07); }
.b-white .b-dot   { background:#e8e4dc; }
.b-blue   { color:#70b0f0; border-color:rgba(30,95,168,0.55);  background:rgba(30,95,168,0.12); }
.b-blue .b-dot    { background:#1e5fa8; }
.b-purple { color:#c090f0; border-color:rgba(112,48,184,0.55); background:rgba(112,48,184,0.12); }
.b-purple .b-dot  { background:#7030b8; }
.b-brown  { color:#d09878; border-color:rgba(138,72,32,0.55);  background:rgba(138,72,32,0.15); }
.b-brown .b-dot   { background:#8a4820; }
.b-black  { color:#b0b0b8; border-color:rgba(110,110,120,0.45); background:rgba(80,80,90,0.12); }
.b-black .b-dot   { background:#505058; box-shadow:0 0 5px rgba(255,255,255,0.18); }
.b-gray   { color:#c0c0c8; border-color:rgba(140,140,155,0.45); background:rgba(140,140,155,0.1); }
.b-gray .b-dot    { background:#909098; }
.b-yellow { color:#e8cc40; border-color:rgba(212,184,32,0.5);  background:rgba(212,184,32,0.1); }
.b-yellow .b-dot  { background:#d4b820; }
.b-orange { color:#e89040; border-color:rgba(208,104,32,0.5);  background:rgba(208,104,32,0.1); }
.b-orange .b-dot  { background:#d06820; }
.b-orange-black { color:#c87830; border-color:rgba(180,80,20,0.5); background:linear-gradient(135deg,rgba(208,104,32,0.15),rgba(30,30,30,0.15)); }
.b-orange-black .b-dot { background:linear-gradient(135deg,#d06820,#222); }
.b-green  { color:#50c870; border-color:rgba(42,136,64,0.5);   background:rgba(42,136,64,0.1); }
.b-green .b-dot   { background:#2a8840; }
.b-green-black { color:#40a860; border-color:rgba(42,136,64,0.5); background:linear-gradient(135deg,rgba(42,136,64,0.15),rgba(30,30,30,0.15)); }
.b-green-black .b-dot { background:linear-gradient(135deg,#2a8840,#222); }

/* 称号エフェクト */
.title-flash { position:fixed; inset:0; z-index:200; pointer-events:none; opacity:0; }
.title-flash.fire { animation:flashAnim 1.2s ease-out forwards; }
@keyframes flashAnim { 0%{opacity:0;background:rgba(212,168,76,0);} 15%{opacity:1;background:rgba(212,168,76,0.25);} 100%{opacity:0;background:rgba(212,168,76,0);} }
.title-popup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.5); z-index:210; pointer-events:none; opacity:0; text-align:center; }
.title-popup.fire { animation:popupAnim 2.8s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes popupAnim { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.05);} 35%{transform:translate(-50%,-50%) scale(1);} 75%{opacity:1;transform:translate(-50%,-50%) scale(1);} 100%{opacity:0;transform:translate(-50%,-50%) scale(0.9);} }
.popup-inner { background:linear-gradient(135deg,#0e1a2e,#1a2840); border:2px solid var(--gold-dim); border-radius:8px; padding:28px 48px; box-shadow:0 0 60px rgba(212,168,76,0.5),0 0 120px rgba(212,168,76,0.2); }
.popup-label { font-family:'Cinzel',serif; font-size:13px; letter-spacing:6px; color:var(--gold-dim); text-transform:uppercase; margin-bottom:8px; }
.popup-name  { font-family:'Noto Sans JP',sans-serif; font-size:28px; font-weight:900; color:var(--white); margin-bottom:12px; }
.popup-title { font-family:'Noto Sans JP',sans-serif; font-size:36px; font-weight:900; color:var(--gold-light); text-shadow:0 0 20px rgba(212,168,76,0.8); }
#confettiCanvas { position:fixed; inset:0; z-index:205; pointer-events:none; opacity:0; }

/* オーバーレイ */
.overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:100; opacity:0; pointer-events:none; transition:opacity 0.5s ease; background:rgba(4,6,10,0.94); }
.overlay.show { opacity:1; }
.ov-title { font-family:'Cinzel',serif; font-size:26px; letter-spacing:7px; color:var(--gold); text-transform:uppercase; }
.ov-bar-wrap { width:360px; height:2px; background:var(--border); border-radius:2px; overflow:hidden; }
.ov-bar { height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold-light)); border-radius:2px; animation:ovAnim 1.6s ease-in-out infinite; }
@keyframes ovAnim { 0%{width:0%;margin-left:0} 50%{width:60%} 100%{width:0%;margin-left:100%} }

/* =====================================================================
   スマホUI
   ===================================================================== */
.mobile-screen { display:none; min-height:100vh; background:var(--bg); flex-direction:column; }
@media (max-width:1024px) {
  body { overflow:auto; }
  .scale-wrapper { display:none !important; }
  .pc-screen     { display:none !important; }
  .mobile-screen { display:flex; }
  .overlay       { display:none !important; }
  #confettiCanvas,.title-flash,.title-popup { display:none !important; }
}
/* TV/FireTVブラウザ対策：?pc=1 をURLに付けるとPC画面を強制表示 */
html.force-pc .mobile-screen { display:none !important; }
html.force-pc .scale-wrapper { display:flex !important; }
html.force-pc .pc-screen     { display:grid !important; }
html.force-pc body { overflow:hidden !important; }
.m-header { padding:18px 20px 12px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,rgba(212,168,76,0.06),transparent); position:relative; }
.m-header::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold) 40%,var(--gold-light) 50%,var(--gold) 60%,transparent); }
.m-title { font-family:'Cinzel',serif; font-size:22px; font-weight:900; letter-spacing:3px; background:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,var(--gold-dim)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; text-transform:uppercase; }
.m-sub { font-size:11px; letter-spacing:3px; color:var(--muted); margin-top:2px; font-family:'Cinzel',serif; text-transform:uppercase; }

/* ===== チェックインセクション（NFC対応） ===== */

.mcp-greeting { font-size:12px; letter-spacing:2px; color:var(--muted); font-family:'Cinzel',serif; text-transform:uppercase; margin-bottom:6px; }

.mcp-info { font-size:12px; color:var(--muted); margin-bottom:12px; }

.mcp-btn { width:100%; padding:14px; background:linear-gradient(135deg,var(--gold-light),var(--gold)); border:none; border-radius:3px; cursor:pointer; font-family:'Cinzel',serif; font-size:14px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--bg); transition:all 0.2s; position:relative; overflow:hidden; }

.m-search-section { padding:14px 20px; border-bottom:1px solid var(--border); background:rgba(212,168,76,0.03); }

/* =====================================================================
   🎃 HALLOWEEN THEME（期間限定装飾）2026
   手動で戻す場合は、このブロックを丸ごと削除してください
   （この下から「🎃 HALLOWEEN THEME ここまで」のコメントの直前まで）
   ===================================================================== */
:root {
  --bg:         #0a0612;
  --surface:    #150c22;
  --card:       #1c1030;
  --border:     #3d2a55;
  --border-hi:  #5a3d7a;
  --gold:       #ff8c1a;
  --gold-light: #ffb347;
  --gold-dim:   #cc5c00;
  --white:      #f5ecff;
  --white-dim:  #cdb8e6;
  --muted:      #8a76a8;
  --kids-a:     #5fd068;
  --kids-a-dim: #1e5c26;
  --kids-b:     #c86bf0;
  --kids-b-dim: #5a1f78;
  --g1:  rgba(255,140,26,0.5);
  --g2:  rgba(200,107,240,0.4);
  --g3:  rgba(95,208,104,0.35);
  --ka1: rgba(95,208,104,0.5);
  --kb1: rgba(200,107,240,0.5);
}
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 640px 420px at 12% 8%,  rgba(255,140,26,0.10), transparent 60%),
    radial-gradient(ellipse 640px 420px at 88% 92%, rgba(200,107,240,0.12), transparent 60%),
    repeating-linear-gradient(0deg,  transparent, transparent 3px, rgba(255,255,255,0.013) 3px, rgba(255,255,255,0.013) 6px),
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(255,255,255,0.009) 3px, rgba(255,255,255,0.009) 6px);
}
body::before {
  background: radial-gradient(ellipse 900px 600px at 50% -80px, rgba(255,140,26,0.12) 0%, transparent 70%);
}
/* ヘッダー見出しに🎃を追加（グラデーション文字は透明クリップされるため、絵文字部分だけ色指定を上書き） */
.hdr-title::before, .hdr-title::after,
.m-title::before,   .m-title::after {
  -webkit-text-fill-color: initial;
  background: none;
  color: var(--gold);
}
.hdr-title::before { content: '🎃 '; }
.hdr-title::after  { content: ' 🎃'; }
.m-title::before   { content: '🎃 '; }
.m-title::after    { content: ' 🎃'; }
.hdr-eyebrow::before { content: '🦇 '; }
.hdr-eyebrow::after  { content: ' 🦇'; }
/* 四隅のクモの巣 */
.pc-screen::before, .pc-screen::after {
  content: '🕸️'; position: absolute; font-size: 60px; opacity: 0.32;
  z-index: 5; pointer-events: none; line-height: 1;
}
.pc-screen::before { top: -8px; left: -8px; }
.pc-screen::after  { top: -8px; right: -8px; transform: scaleX(-1); }
/* 浮遊するコウモリ（JS側で生成した要素に適用） */
.hw-bat {
  position: fixed; z-index: 6; pointer-events: none; opacity: 0.85;
  animation: hwBatFly linear infinite;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.6));
}
@keyframes hwBatFly {
  0%   { transform: translateX(-60px) translateY(0) scale(1); }
  25%  { transform: translateX(520px) translateY(-36px) scale(1); }
  50%  { transform: translateX(1040px) translateY(18px) scale(-1,1); }
  75%  { transform: translateX(1560px) translateY(-24px) scale(-1,1); }
  100% { transform: translateX(2020px) translateY(0) scale(1); }
}
/* PODIUM 1〜3位カードを枠色ごとハロウィン仕様に */
.p-card.a-r1::before { background: linear-gradient(180deg, var(--gold-light), var(--gold)); }
.p-card.a-r2::before { background: linear-gradient(180deg, #e0b8f8, var(--kids-b)); }
.p-card.a-r3::before { background: linear-gradient(180deg, #90e8a0, var(--kids-a)); }

/* 浮遊する幽霊（コウモリとは違う、ふわふわ上下する軌道） */
.hw-ghost {
  position: fixed; z-index: 6; pointer-events: none; opacity: 0.65;
  animation: hwGhostFloat linear infinite;
  filter: drop-shadow(0 0 8px rgba(200,107,240,0.5));
}
@keyframes hwGhostFloat {
  0%   { transform: translateX(-60px) translateY(0); }
  20%  { transform: translateX(420px) translateY(-50px); }
  40%  { transform: translateX(840px) translateY(10px); }
  60%  { transform: translateX(1260px) translateY(-40px); }
  80%  { transform: translateX(1680px) translateY(20px); }
  100% { transform: translateX(2100px) translateY(0); }
}

/* 天井からぶら下がって揺れるクモ */
.hw-spider-wrap {
  position: fixed; top: -20px; z-index: 6; pointer-events: none;
  transform-origin: top center;
  animation: hwSpiderSwing ease-in-out infinite;
}
.hw-spider-thread {
  width: 1px; margin: 0 auto; background: rgba(220,210,235,0.5);
}
.hw-spider-icon { display: block; text-align: center; filter: drop-shadow(0 0 5px rgba(0,0,0,0.6)); }
@keyframes hwSpiderSwing {
  0%, 100% { transform: rotate(-12deg); }
  50%      { transform: rotate(12deg); }
}

/* たまに登場するバンパイア（コウモリより遅く、目立つ） */
.hw-vampire {
  position: fixed; z-index: 6; pointer-events: none; opacity: 0.9;
  animation: hwVampireWalk linear infinite;
  filter: drop-shadow(0 0 8px rgba(255,140,26,0.5));
}
@keyframes hwVampireWalk {
  0%   { transform: translateX(-80px) scaleX(1); }
  48%  { transform: translateX(1060px) scaleX(1); }
  50%  { transform: translateX(1060px) scaleX(-1); }
  98%  { transform: translateX(-80px) scaleX(-1); }
  100% { transform: translateX(-80px) scaleX(1); }
}

/* タイトルがたまにオレンジ⇄パープルでゆらめく演出 */
.hdr-title, .m-title { animation: hwTitleFlicker 6s ease-in-out infinite; }
@keyframes hwTitleFlicker {
  0%, 88%, 100% { filter: none; }
  90%  { filter: hue-rotate(35deg) brightness(1.15); }
  93%  { filter: none; }
  95%  { filter: hue-rotate(-20deg) brightness(1.1); }
  97%  { filter: none; }
}

/* ===== 常時演出：満月・流れる雲・足元の霧 ===== */
.hw-moon {
  position: fixed; top: 40px; right: 120px; width: 180px; height: 180px;
  border-radius: 50%; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at 40% 38%, #fff6d8 0%, #ffe6a8 45%, #f0c878 100%);
  box-shadow: 0 0 60px 20px rgba(255,220,150,0.25), 0 0 140px 60px rgba(255,180,80,0.12);
  animation: hwMoonGlow 8s ease-in-out infinite;
}
@keyframes hwMoonGlow {
  0%, 100% { box-shadow: 0 0 60px 20px rgba(255,220,150,0.25), 0 0 140px 60px rgba(255,180,80,0.12); }
  50%      { box-shadow: 0 0 80px 30px rgba(255,220,150,0.35), 0 0 180px 80px rgba(255,180,80,0.18); }
}
.hw-cloud {
  position: fixed; z-index: 0; pointer-events: none;
  width: 320px; height: 70px; border-radius: 60px;
  background: rgba(60,40,90,0.85); filter: blur(14px);
  animation: hwCloudDrift linear infinite;
}
@keyframes hwCloudDrift {
  0%   { transform: translateX(-400px); }
  100% { transform: translateX(2300px); }
}
.hw-fog {
  position: fixed; left: 0; right: 0; bottom: 0; height: 220px;
  z-index: 4; pointer-events: none;
  background: linear-gradient(180deg, transparent 0%, rgba(160,140,200,0.10) 50%, rgba(160,140,200,0.22) 100%);
  animation: hwFogPulse 10s ease-in-out infinite;
}
.hw-fog.f2 {
  height: 140px; animation-duration: 14s; animation-delay: 4s;
  background: linear-gradient(180deg, transparent 0%, rgba(200,107,240,0.08) 60%, rgba(200,107,240,0.18) 100%);
}
@keyframes hwFogPulse {
  0%, 100% { opacity: 0.6; transform: translateX(0); }
  50%      { opacity: 1;   transform: translateX(40px); }
}

/* ===== サプライズ演出①：雷（画面が一瞬光って揺れる） ===== */
.hw-flash {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background: radial-gradient(ellipse at 50% 20%, rgba(255,255,255,0.95), rgba(200,160,255,0.6) 40%, transparent 75%);
  opacity: 0; animation: hwFlash 1.6s ease-out forwards;
}
@keyframes hwFlash {
  0%   { opacity: 0; }
  6%   { opacity: 1; }
  12%  { opacity: 0.1; }
  20%  { opacity: 0.9; }
  30%  { opacity: 0; }
  55%  { opacity: 0.6; }
  70%  { opacity: 0; }
  100% { opacity: 0; }
}
.hw-shake { animation: hwShake 0.6s ease-in-out; }
@keyframes hwShake {
  0%, 100% { transform: translate(0,0); }
  20%  { transform: translate(-6px, 4px); }
  40%  { transform: translate(6px, -3px); }
  60%  { transform: translate(-4px, 3px); }
  80%  { transform: translate(4px, -2px); }
}

/* ===== サプライズ演出②：巨大な幽霊が「BOO!」と叫びながら横切る ===== */
.hw-boo {
  position: fixed; top: 30%; left: 0; z-index: 45; pointer-events: none;
  font-size: 220px; line-height: 1;
  filter: drop-shadow(0 0 30px rgba(200,107,240,0.8));
  animation: hwBooSwoop 4.5s ease-in-out forwards;
}
.hw-boo-text {
  position: absolute; top: -40px; left: 180px;
  font-family: 'Cinzel', serif; font-weight: 900; font-size: 90px;
  color: var(--gold); letter-spacing: 6px;
  text-shadow: 0 0 20px rgba(255,140,26,0.9), 0 0 50px rgba(255,140,26,0.5);
  animation: hwBooTextPop 4.5s ease-out forwards;
}
@keyframes hwBooSwoop {
  0%   { transform: translateX(-400px) translateY(60px) rotate(-8deg); opacity: 0; }
  15%  { opacity: 1; }
  50%  { transform: translateX(900px) translateY(-40px) rotate(6deg); }
  85%  { opacity: 1; }
  100% { transform: translateX(2200px) translateY(40px) rotate(-6deg); opacity: 0; }
}
@keyframes hwBooTextPop {
  0%, 25% { transform: scale(0); opacity: 0; }
  35%  { transform: scale(1.3); opacity: 1; }
  45%  { transform: scale(1); }
  80%  { opacity: 1; }
  100% { transform: scale(1.1); opacity: 0; }
}

/* ===== サプライズ演出③：カボチャの雨 ===== */
.hw-drop {
  position: fixed; top: -80px; z-index: 45; pointer-events: none;
  animation: hwDropFall linear forwards;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
}
@keyframes hwDropFall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(1250px) rotate(720deg); opacity: 0; }
}

/* ===== サプライズ演出④：コウモリの大群 ===== */
.hw-swarm {
  position: fixed; z-index: 45; pointer-events: none;
  animation: hwSwarmFly linear forwards;
  filter: drop-shadow(0 0 5px rgba(0,0,0,0.6));
}
@keyframes hwSwarmFly {
  0%   { transform: translateX(-80px) translateY(0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateX(2100px) translateY(-60px); opacity: 0; }
}
/* ===== スマホ表示用の調整（モニター/TVの ?pc=1 表示には影響しない） =====
   狭い画面では満月・雲・バンパイアが邪魔になるので非表示にし、
   霧と巨大幽霊は小さくする */
@media (max-width:1024px) {
  html:not(.force-pc) .hw-moon,
  html:not(.force-pc) .hw-cloud,

  html:not(.force-pc) .hw-boo-text { font-size:40px; left:95px; top:-18px; letter-spacing:3px; }
}

<script>
// ============================================================
// ★★★ 画面解像度の自動スケーリング ★★★
// 1920x1080デザインを基準に、どんな解像度でも
// 16:9比率を保ったまま画面いっぱいに自動調整
// ============================================================
function fitScale() {
  const wrapper = document.getElementById('scaleWrapper');
  const screen  = document.getElementById('pcScreen');
  if (!wrapper || !screen) return;
  const forcePC = document.documentElement.classList.contains('force-pc');
  if (window.innerWidth <= 1024 && !forcePC) return; // スマホ表示時はスケーリング処理をスキップ
  const scaleX = window.innerWidth  / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale  = Math.min(scaleX, scaleY);
  screen.style.transform = `scale(${scale})`;
  screen.style.transformOrigin = 'center center';
}
// TV/FireTVブラウザがウィンドウ幅を誤検知してスマホUIになってしまう場合の対策
// URLに ?pc=1 を付けると強制的にPC画面（ランキングモニター）を表示する
(function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('pc') === '1') {
    document.documentElement.classList.add('force-pc');
  }
})();
window.addEventListener('resize', fitScale);
window.addEventListener('orientationchange', fitScale);
fitScale();

// ============================================================
// ★★★ 設定 ★★★
// ============================================================
const SHEET_API_URL     = 'https://script.google.com/macros/s/AKfycbyIRtKTtXtNX04KCIqkv2mNvDesQFW5OkyJxRBaFcmQz4chR8XTBmUxVi2EPEDy5bvJYg/exec';

// ============================================================
// 言語切り替え（スマホ画面のみ）
// ============================================================
let currentLang = 'ja';
const LANG = {
  ja: {
    welcomeBack: 'Welcome Back',
    checkinBtn: '⚔ チェックイン',
    checkinSending: '送信中...',
    checkinDoneTitle: 'チェックイン完了',
    monthlyLabel: '今月',
    totalLabel: '累計',
    times: '回',
    trackerLabel: '▸ 帯昇格トラッカー',
    searchPlaceholder: '名前を入力...',
    searchBtn: '検索',
    tabAdult: 'アダルト',
    tabKidsA: 'キッズA',
    tabKidsB: 'キッズB',
    trackerAdult: 'ADULT',
    trackerKids: 'KIDS',
    achieved: '達成 ✓',
    cumulativeParticipation: '累計参加回数',
    notFound: (q) => `「${q}」が見つかりませんでした`,
    isAdultMember: (name) => `「${name}」はアダルト会員です。<br>ADULTタブに切り替えて検索してください`,
    isKidsMember: (name) => `「${name}」はキッズ会員です。<br>KIDSタブに切り替えて検索してください`,
    lastUpdated: 'Last Updated',
    errorGeneric: 'エラーが発生しました',
    errorNetwork: '通信エラーです',
    nfcHint: 'NFCカードでチェックインしてください',
  },
  pt: {
    welcomeBack: 'Bem-vindo(a)',
    checkinBtn: '⚔ Check-in',
    checkinSending: 'Enviando...',
    checkinDoneTitle: 'Check-in concluído',
    monthlyLabel: 'Este mês',
    totalLabel: 'Total',
    times: 'vezes',
    trackerLabel: '▸ Rastreador de Faixa',
    searchPlaceholder: 'Digite o nome...',
    searchBtn: 'Buscar',
    tabAdult: 'Adulto',
    tabKidsA: 'Kids A',
    tabKidsB: 'Kids B',
    trackerAdult: 'ADULTO',
    trackerKids: 'KIDS',
    achieved: 'Concluído ✓',
    cumulativeParticipation: 'Total de participações',
    notFound: (q) => `"${q}" não foi encontrado`,
    isAdultMember: (name) => `"${name}" é membro Adulto.<br>Mude para a aba ADULTO para buscar`,
    isKidsMember: (name) => `"${name}" é membro Kids.<br>Mude para a aba KIDS para buscar`,
    lastUpdated: 'Última atualização',
    errorGeneric: 'Ocorreu um erro',
    errorNetwork: 'Erro de conexão',
    nfcHint: 'Use o cartão NFC para fazer check-in',
  },
};
function t(key, ...args) {
  const entry = LANG[currentLang][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}
function toggleLang() {
  currentLang = currentLang === 'ja' ? 'pt' : 'ja';
  const btn = document.getElementById('langToggle');
  if (btn) btn.textContent = currentLang === 'ja' ? '🇧🇷 PT' : '🇯🇵 JP';
  applyMobileTranslations();
  renderMobile();
}
function applyMobileTranslations() {
  const wb = document.querySelector('#checkinPersonal .mcp-greeting'); if (wb) wb.textContent = t('welcomeBack');
  const cb = document.getElementById('checkinBtn'); if (cb && !cb.disabled) cb.textContent = t('checkinBtn');
  const gcb = document.getElementById('genericCheckinBtn'); if (gcb) gcb.textContent = t('checkinBtn');
  const cdt = document.querySelector('#checkinDone .mcd-title'); if (cdt) cdt.textContent = t('checkinDoneTitle');
  const tl = document.querySelector('.m-search-label'); if (tl) tl.textContent = t('trackerLabel');
  const si = document.getElementById('searchInput'); if (si) si.placeholder = t('searchPlaceholder');
  const sb = document.querySelector('.m-search-btn'); if (sb) sb.textContent = t('searchBtn');
  const ta = document.getElementById('tabAdult'); if (ta) ta.textContent = t('tabAdult');
  const tka = document.getElementById('tabKidsA'); if (tka) tka.textContent = t('tabKidsA');
  const tkb = document.getElementById('tabKidsB'); if (tkb) tkb.textContent = t('tabKidsB');
  const trA = document.getElementById('trackerTabAdult'); if (trA) trA.textContent = t('trackerAdult');
  const trK = document.getElementById('trackerTabKids'); if (trK) trK.textContent = t('trackerKids');
  document.querySelectorAll('.mcp-info').forEach(el => {
    const monthlyVal = document.getElementById('checkinMonthly') ? document.getElementById('checkinMonthly').textContent : '0';
    const totalVal = document.getElementById('checkinTotal') ? document.getElementById('checkinTotal').textContent : '0';
    el.innerHTML = t('monthlyLabel') + ' <span id="checkinMonthly">' + monthlyVal + '</span> ' + t('times') + ' ／ ' + t('totalLabel') + ' <span id="checkinTotal">' + totalVal + '</span> ' + t('times');
  });
  document.querySelectorAll('.mcd-count').forEach(el => {
    const monthlyVal = document.getElementById('doneMonthly') ? document.getElementById('doneMonthly').textContent : '0';
    const totalVal = document.getElementById('doneTotal') ? document.getElementById('doneTotal').textContent : '0';
    el.innerHTML = t('monthlyLabel') + ' <span id="doneMonthly">' + monthlyVal + '</span> ' + t('times') + ' ／ ' + t('totalLabel') + ' <span id="doneTotal">' + totalVal + '</span> ' + t('times');
  });
}
const FETCH_INTERVAL_MS = 10 * 1000;  // 10秒ごとに取得（画面の再描画は変化があった時だけ）

// キッズ帯昇格トラッカー閾値
const KIDS_BELT_THRESHOLDS = (() => {
  const steps = [
    {from:'white',        to:'gray',         need:80},
    {from:'gray',         to:'yellow',       need:80},
    {from:'yellow',       to:'orange',       need:90},
    {from:'orange',       to:'orange-black', need:100},
    {from:'orange-black', to:'green',        need:100},
    {from:'green',        to:'green-black',  need:100},
  ];
  let acc=0;
  return steps.map(s=>{const start=acc; acc+=s.need; return {...s,start,end:acc};});
})();
function getTitle(member) {
  const isKids = member.category !== 'adult';
  const table  = isKids ? KIDS_TITLES : ADULT_TITLES;
  const steps  = table[member.belt] || Object.values(table)[0];
  const total  = member.total || 0;
  let result   = steps[0];
  for (const s of steps) { if (total >= s.min) result = s; }
  if (currentLang === 'pt' && result.namePt) {
    return Object.assign({}, result, { name: result.namePt });
  }
  return result;
}
function titleBadgeHTML(member) {
  if (currentLang === 'pt') return '';
  const t = getTitle(member);
  return `<span class="t-badge t-${t.level}"><span class="t-icon">${t.level==='high'?'⭐':t.level==='mid'?'🔥':'◆'}</span>${t.name}</span>`;
}

// チェックイン機能（NFC個人対応）
// auto=1 パラメータがあれば自動でチェックイン実行

const AUTO_CHECKIN = URL_PARAMS.get('auto') === '1';

function initCheckin() {
  const personal    = document.getElementById('checkinPersonal');
  const genericBtn  = document.getElementById('genericCheckinBtn');
  const checkinHint = document.getElementById('checkinHint');

  if (NFC_MEMBER_ID && nfcMember) {
    // カテゴリに合わせてタブを切り替え
    if (nfcMember.category) switchMobileTab(nfcMember.category);

    if (AUTO_CHECKIN) {
      // auto=1 → データ取得完了後に自動チェックイン実行
      // 少し待ってから実行（画面描画完了を待つ）
      setTimeout(() => doCheckin(), 300);
    } else {
      // 手動チェックイン画面を表示
      personal.classList.add('show');
      document.getElementById('checkinName').textContent    = nfcMember.name;
      document.getElementById('checkinMonthly').textContent = nfcMember.monthly;
      document.getElementById('checkinTotal').textContent   = nfcMember.total.toLocaleString();
    }
  } else if (NFC_MEMBER_ID && !nfcMember) {
    checkinHint.textContent  = `ID: ${NFC_MEMBER_ID} が見つかりませんでした`;
    genericBtn.style.display = 'block';
  } else {
    genericBtn.style.display = 'block';
    checkinHint.textContent  = 'NFCカードをタップするか、スタッフに声をかけてください';
  }
}

async function doCheckin() {
  if (!nfcMember || checkinDone) return;
  checkinDone = true;

  // ボタンがある場合のみ操作（手動モード）
  const btn = document.getElementById('checkinBtn');
  if (btn) { btn.disabled = true; btn.textContent = t('checkinSending'); }

  // auto=1 の場合はすぐに「処理中」表示
  if (AUTO_CHECKIN) {
    const done = document.getElementById('checkinDone');
    document.getElementById('doneeName').textContent   = nfcMember.name;
    document.getElementById('doneMonthly').textContent = nfcMember.monthly;
    document.getElementById('doneTotal').textContent   = nfcMember.total.toLocaleString();
    done.classList.add('show');
  }

  try {
    const res  = await fetch(SHEET_API_URL, {
      method: 'POST',
      body:   JSON.stringify({ id: NFC_MEMBER_ID }),
    });
    const data = await res.json();

    if (data.success) {
      // 完了画面を更新（実際の数値に）
      document.getElementById('checkinPersonal').classList.remove('show');
      const done = document.getElementById('checkinDone');
      done.classList.add('show');
      document.getElementById('doneeName').textContent    = nfcMember.name;
      document.getElementById('doneMonthly').textContent  = data.monthly;
      document.getElementById('doneTotal').textContent    = data.total.toLocaleString();
      // チェックイン直後に即座にランキングを更新
      fetchData(true);
      // 4秒後にページをリセット（次の人のために）
      setTimeout(() => {
        window.location.href = window.location.pathname;
      }, 4000);
    } else {
      checkinDone = false;
      if (btn) { btn.disabled = false; btn.textContent = t('checkinBtn'); }
      showMobileToast(t('errorGeneric'));
    }
  } catch(e) {
    checkinDone = false;
    if (btn) { btn.disabled = false; btn.textContent = t('checkinBtn'); }
    showMobileToast(t('errorNetwork'));
  }
}

function showCheckinHint() {
  showMobileToast(t('nfcHint'));

function checkTitleChanges(members) {
  for (const m of members) {
    const key      = `${m.name}_${m.category}`;
    const newTitle = getTitle(m).name;
    const oldTitle = prevTitles[key];
    // 帯昇格チェック（称号より優先・より派手な演出）
    const newBelt = m.belt;
    const oldBelt = prevBelts[key];
    if (oldBelt && oldBelt !== newBelt) {
      firePromotionEffect(m.name, newBelt, m.category);
    } else if (oldTitle && oldTitle !== newTitle) {
      fireTitleEffect(m.name, newTitle);
    }
    prevTitles[key] = newTitle;
    prevBelts[key]  = newBelt;
  }
}
// 帯昇格の専用演出（称号変化よりド派手に）
function firePromotionEffect(name, newBelt, category) {
  const labels = (category === 'adult') ? ADULT_BELT_LABELS : KIDS_BELT_LABELS;
  const beltLabel = (labels && labels[newBelt]) || newBelt;
  const flash = document.getElementById('titleFlash');
  flash.className = 'title-flash'; void flash.offsetWidth;
  flash.className = 'title-flash fire';
  document.getElementById('popupName').textContent  = name;
  document.getElementById('popupTitle').textContent = `🎊 ${beltLabel} 昇格！ 🎊`;
  const popup = document.getElementById('titlePopup');
  popup.className = 'title-popup'; void popup.offsetWidth;
  popup.className = 'title-popup fire';
  // 紙吹雪を3連発で豪華に
  fireConfetti();
  setTimeout(fireConfetti, 700);
  setTimeout(fireConfetti, 1400);
}
function fireTitleEffect(name, titleName) {
  const flash = document.getElementById('titleFlash');
  flash.className = 'title-flash'; void flash.offsetWidth;
  flash.className = 'title-flash fire';
  document.getElementById('popupName').textContent  = name;
  document.getElementById('popupTitle').textContent = titleName;
  const popup = document.getElementById('titlePopup');
  popup.className = 'title-popup'; void popup.offsetWidth;
  popup.className = 'title-popup fire';
  fireConfetti();
}
function fireConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx    = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  canvas.style.opacity = '1';
  const colors = ['#f0d070','#d4a84c','#ffffff','#5aacf0','#50d0a0','#c090f0'];
  const pieces = Array.from({length:120}, () => ({
    x:Math.random()*canvas.width, y:-20,
    w:Math.random()*10+5, h:Math.random()*5+3,
    color:colors[Math.floor(Math.random()*colors.length)],
    speed:Math.random()*4+2, angle:Math.random()*360,
    spin:Math.random()*6-3, drift:Math.random()*2-1,
  }));
  let frame=0;
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height); let alive=false;
    for (const p of pieces) {
      p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
      if (p.y<canvas.height+20) alive=true;
      ctx.save(); ctx.translate(p.x+p.w/2,p.y+p.h/2); ctx.rotate(p.angle*Math.PI/180);
      ctx.fillStyle=p.color; ctx.globalAlpha=Math.max(0,1-p.y/canvas.height);
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if (alive&&frame<180){frame++;requestAnimationFrame(draw);}
    else{ctx.clearRect(0,0,canvas.width,canvas.height);canvas.style.opacity='0';}
  }
  draw();
}

// ============================================================
// データ取得
// ============================================================
async function fetchData(isRefresh = false) {
  fetchElapsed = 0;
  if (!isRefresh) showOverlay('loadingOv');

  let newMembers = null;
  let fetchFailed = false;
  try {
    // ★通信が固まって無制限に待ち続けないよう、6秒でタイムアウトさせる
    // （AbortController非対応の古いTVブラウザでは、この保護なしで通常のfetchを行う）
    let fetchOptions = {};
    let timeoutId = null;
    if (typeof AbortController !== 'undefined') {
      const controller = new AbortController();
      timeoutId = setTimeout(() => controller.abort(), 6000);
      fetchOptions = { signal: controller.signal };
    }
    const res  = await fetch(`${SHEET_API_URL}?t=${Date.now()}`, fetchOptions);
    if (timeoutId) clearTimeout(timeoutId);
    const data = await res.json();
    if (data.error || !Array.isArray(data.members)) throw new Error(data.error||'invalid');
    newMembers = data.members;
    isOnline = true;
    lastGoodFetch = Date.now();
  } catch(e) {
    console.error(e);
    // サンプルデータは使わない：前回の正常データを表示し続ける
    isOnline = false;
    fetchFailed = true;
  }
  updateConnBadge();

  // ★データに実際の変化があったかを比較（順位・回数・帯などが1つでも変わっていればtrue）
  const newSnapshot = newMembers ? JSON.stringify(newMembers) : null;
  const hasChanged  = newMembers && newSnapshot !== lastDataSnapshot;

  if (!isRefresh) {
    // 初回読み込みは必ず描画
    if (newMembers) allMembers = newMembers;
    lastDataSnapshot = newSnapshot;
    if (NFC_MEMBER_ID) {
      nfcMember = allMembers.find(m => String(m.id).trim() === String(NFC_MEMBER_ID).trim()) || null;
    }
    checkTitleChanges(allMembers);
    hideAllOverlays();
    setLastUpdate();
    renderPC();
    renderMobile();
    initCheckin();
  } else if (hasChanged) {
    // ★変化があった時だけ、フェード演出つきで再描画
    document.getElementById('pcScreen').classList.add('fading');
    await sleep(550); showOverlay('refreshOv');

    allMembers = newMembers;
    lastDataSnapshot = newSnapshot;
    if (NFC_MEMBER_ID) {
      nfcMember = allMembers.find(m => String(m.id).trim() === String(NFC_MEMBER_ID).trim()) || null;
    }
    checkTitleChanges(allMembers);
    hideAllOverlays();
    document.getElementById('pcScreen').classList.remove('fading');
    setLastUpdate();
    renderPC();
    renderMobile();
  } else {
    // ★変化なし：画面は一切さわらず、最終更新時刻だけ静かに更新
    if (newMembers) setLastUpdate();
  }

  // ★通信に失敗した時は10秒待たず、3秒後にすぐ再試行して早期復帰を狙う
  const nextInterval = fetchFailed ? 3 * 1000 : FETCH_INTERVAL_MS;
  setTimeout(() => fetchData(true), nextInterval);
}

function startSlideProgress() {
  if (slideRaf) cancelAnimationFrame(slideRaf);
  slideStart=null;
  function animate(ts) {
    if (!slideStart) slideStart=ts;
    const elapsed=ts-slideStart;
    const pct=Math.min((elapsed/SLIDE_INTERVAL_MS)*100,100);
    const bar=document.getElementById('slideBar');
    if (bar) bar.style.width=pct+'%';
    if (elapsed<SLIDE_INTERVAL_MS) { slideRaf=requestAnimationFrame(animate); }
    else { toggleSlide(); }
  }
  slideRaf=requestAnimationFrame(animate);
}
function toggleSlide() {
  slideIndex=(slideIndex+1)%SLIDES.length;
  const main=document.getElementById('pcMain');
  main.style.opacity='0'; main.style.transition='opacity 0.5s ease';
  setTimeout(()=>{renderPCSlide(SLIDES[slideIndex]);main.style.opacity='1';},500);

function searchTracker() {
  const query=document.getElementById('searchInput').value.trim();
  const result=document.getElementById('trackerResult');
  if (!query){result.innerHTML='';return;}

  if (trackerMode==='adult') {
    const member=allMembers.find(m=>m.name.includes(query)&&m.category==='adult');
    if (!member) {
      const km=allMembers.find(m=>m.name.includes(query)&&m.category!=='adult');
      result.innerHTML=km
        ?`<div class="tracker-kids-note">${t('isKidsMember', km.name)}</div>`
        :`<div class="tracker-not-found">${t('notFound', query)}</div>`;
      return;
    }
    const total=member.total;
    const stepsHTML=BELT_THRESHOLDS.map(step=>{
      const isDone=total>=step.end; const isInProg=!isDone&&total>=step.start;
      const filled=isDone?step.need:isInProg?total-step.start:0;
      const pct=isDone?100:isInProg?Math.round((filled/step.need)*100):0;
      const barCls=isDone?'done':isInProg?'prog':'none';

        </div>

    }).join('');
    result.innerHTML=`

      const am=allMembers.find(m=>m.name.includes(query)&&m.category==='adult');
      result.innerHTML=am
        ?`<div class="tracker-kids-note">${t('isAdultMember', am.name)}</div>`
        :`<div class="tracker-not-found">${t('notFound', query)}</div>`;
      return;
    }
    const total=member.total;
    const stepsHTML=KIDS_BELT_THRESHOLDS.map(step=>{
      const isDone=total>=step.end; const isInProg=!isDone&&total>=step.start;
      const filled=isDone?step.need:isInProg?total-step.start:0;
      const pct=isDone?100:isInProg?Math.round((filled/step.need)*100):0;

<!-- 🧹 MAINTENANCE（常設）— メモリ解放・キャッシュ更新・自動アップデート検知。季節演出とは無関係なので消さないでください -->
<script>
(function () {
  // モニター/TV表示のときだけ動かす（スマホでチェックイン中に勝手にリロードしないため）
  const isMonitor = () => window.innerWidth > 1024 || document.documentElement.classList.contains('force-pc');

  // ---- キャッシュを使わない完全リロード（?pc=1 などの既存パラメータは維持） ----
  window.guildHardReload = function (reason) {
    try {
      const url = new URL(location.href);
      url.searchParams.set('_r', Date.now().toString()); // キャッシュ回避用
      console.log('[maintenance] reload:', reason || 'manual');
      location.replace(url.toString());
    } catch (e) {
      location.reload();
    }
  };

  // ---- ① メモリ監視：使用量が上限を超えたらリロードして解放（Chrome系のみ計測可能） ----
  const MEMORY_LIMIT_MB = 350;
  setInterval(() => {
    if (!isMonitor()) return;
    const mem = performance && performance.memory;
    if (!mem) return;
    const usedMB = mem.usedJSHeapSize / (1024 * 1024);
    if (usedMB > MEMORY_LIMIT_MB) window.guildHardReload('memory ' + Math.round(usedMB) + 'MB');
  }, 5 * 60 * 1000);

  // ---- ② 自動アップデート検知：GitHubに新しいHTMLを上げたら、モニター側が自動で読み直す ----
  //     10分ごとに自分自身を再取得して内容が変わっていたらリロード
  //     （通信エラーや途中切れファイルで誤反応しないよう、2回連続で差分があった時だけ実行）
  function hashText(t) { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return h; }
  let baselineHash = null, diffStrikes = 0;
  async function fetchSelf() {
    const url = new URL(location.href);
    url.searchParams.set('_chk', Date.now().toString());
    const res = await fetch(url.toString(), { cache: 'no-store' });
    if (!res.ok) throw new Error('status ' + res.status);
    const text = await res.text();
    // 正常なモニターHTMLであること（途中切れ・エラーページを除外）
    if (!text.includes('id="pcScreen"') || !text.trim().endsWith('</html>')) throw new Error('incomplete html');
    return hashText(text);
  }
  async function checkUpdate() {
    if (!isMonitor()) return;
    try {
      const h = await fetchSelf();
      if (baselineHash === null) { baselineHash = h; return; }
      if (h !== baselineHash) {
        diffStrikes += 1;
        if (diffStrikes >= 2) window.guildHardReload('update detected');
      } else {
        diffStrikes = 0;
      }
    } catch (e) { /* 一時的な通信エラーは無視して次回に */ }
  }
  setTimeout(checkUpdate, 20 * 1000);           // 起動20秒後に基準値を取得
  setInterval(checkUpdate, 10 * 60 * 1000);     // 以降10分ごと

  // ---- ③ DOM掃除：演出の残骸（万一消し忘れた要素）を定期的に除去 ----
  const TRANSIENT_CLASSES = ['hw-flash', 'hw-boo', 'hw-drop', 'hw-swarm', 'hw-energy-burst'];
  setInterval(() => {
    TRANSIENT_CLASSES.forEach(cls => {
      document.querySelectorAll('.' + cls).forEach(el => el.remove());
    });
  }, 3 * 60 * 1000);
})();
</script>

  moon.className = 'hw-moon';
  document.body.appendChild(moon);

  [ { top: '70px',  duration: 60, delay: 0  },
    { top: '130px', duration: 85, delay: 25 } ].forEach(cfg => {
    const cloud = document.createElement('div');
    cloud.className = 'hw-cloud';
    cloud.style.top = cfg.top;
    cloud.style.animationDuration = cfg.duration + 's';
    cloud.style.animationDelay = '-' + cfg.delay + 's';
    document.body.appendChild(cloud);
  });

  const fog1 = document.createElement('div'); fog1.className = 'hw-fog';
  const fog2 = document.createElement('div'); fog2.className = 'hw-fog f2';
  document.body.appendChild(fog1);
  document.body.appendChild(fog2);
})();

// ===== サプライズ演出：数分に1回、ランダムで派手なイベントが発生 =====
(function () {
  // ※揺れは .pc-screen ではなく body にかける
  //   （.pc-screen には画面フィット用の scale() が入っているため、
  //     transform を上書きすると一瞬スケールが外れてカクつくのを防ぐ）
  const shakeTarget = document.body;

  // ①雷：画面が光って揺れる
  function lightning() {
    const flash = document.createElement('div');
    flash.className = 'hw-flash';
    document.body.appendChild(flash);
    shakeTarget.classList.add('hw-shake');
    setTimeout(() => shakeTarget.classList.remove('hw-shake'), 700);
    setTimeout(() => flash.remove(), 1800);
  }

  // ②巨大な幽霊が「BOO!」と叫びながら横切る
  function boo() {
    const ghost = document.createElement('div');
    ghost.className = 'hw-boo';
    ghost.textContent = '👻';
    const text = document.createElement('div');
    text.className = 'hw-boo-text';
    text.textContent = 'BOO!';
    ghost.appendChild(text);
    document.body.appendChild(ghost);
    setTimeout(() => ghost.remove(), 4800);
  }

  // ③カボチャの雨（お菓子も混ぜて賑やかに）
  function pumpkinRain() {
    const items = ['🎃', '🎃', '🎃', '🍬', '🍭', '🍫', '🎃'];
    const count = 28;
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'hw-drop';
      d.textContent = items[Math.floor(Math.random() * items.length)];
      d.style.left = (Math.random() * 100) + '%';
      d.style.fontSize = (22 + Math.random() * 26) + 'px';
      const dur = 3.5 + Math.random() * 2.5;
      d.style.animationDuration = dur + 's';
      d.style.animationDelay = (Math.random() * 1.8) + 's';
      document.body.appendChild(d);
      setTimeout(() => d.remove(), (dur + 2.2) * 1000);
    }
  }

  // ④コウモリの大群
  function batSwarm() {
    const count = 18;
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'hw-swarm';
      b.textContent = '🦇';
      b.style.top = (5 + Math.random() * 85) + '%';
      b.style.fontSize = (18 + Math.random() * 22) + 'px';
      const dur = 2.5 + Math.random() * 2;
      b.style.animationDuration = dur + 's';
      b.style.animationDelay = (Math.random() * 1.5) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), (dur + 1.8) * 1000);
    }
  }

  const events = [lightning, boo, pumpkinRain, batSwarm];
  let lastIndex = -1;

  function scheduleNext() {
    // 70〜130秒のランダム間隔で発生（同じ演出が連続しないようにする）
    const wait = (70 + Math.random() * 60) * 1000;
    setTimeout(() => {
      let idx;
      do { idx = Math.floor(Math.random() * events.length); } while (idx === lastIndex && events.length > 1);
      lastIndex = idx;
      try { events[idx](); } catch (e) { /* 演出の失敗でモニター本体を止めない */ }
      scheduleNext();
    }, wait);
  }

  // 起動から20秒後に最初のイベント（雷）で「おおっ」を作り、その後ランダム
  setTimeout(() => { lightning(); scheduleNext(); }, 20000);
})();

// ハロウィン限定BGM（ループ再生）
// ソース：GitHubリポジトリ内の halloween-bgm.mp3（このHTMLファイルと同じ場所に配置してください）
(function () {
  const bgm = document.createElement('audio');
  bgm.id = 'hwBgm';
  bgm.src = 'halloween-bgm.mp3';
  bgm.loop = true;
  bgm.volume = 0.35; // 常時流しっぱなしのBGMなので控えめな音量に
  bgm.preload = 'auto';
  document.body.appendChild(bgm);

  function tryPlay() {
    const p = bgm.play();
    if (p && p.catch) p.catch(() => { /* ブラウザの自動再生制限。下のクリック待ちで再試行 */ });
  }
  tryPlay();

  // 自動再生がブロックされた場合、画面に一度触れた時点で再生を開始する
  // （その後はブラウザがこのページでの音声再生を許可し続ける）
  const resumeOnInteract = () => {
    tryPlay();
    document.removeEventListener('click', resumeOnInteract);
    document.removeEventListener('touchstart', resumeOnInteract);
  };
  document.addEventListener('click', resumeOnInteract);
  document.addEventListener('touchstart', resumeOnInteract);
})();
</script>
